name: 'data_platform'
version: '1.0.0'
config-version: 2

profile: 'data_platform'
require-dbt-version: [">=1.8.0", "<1.9.0"]

model-paths: ["models"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  cdc_lookback_ms: 3600000   # 1h re-read window for incremental silver (used by the silver models)
