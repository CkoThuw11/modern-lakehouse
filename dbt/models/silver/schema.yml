version: 2

models:
  - name: silver_customers
    description: Active (non-deleted) customers, typed and conformed.
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: silver_orders
    description: Active (non-deleted) orders, typed and conformed.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

  - name: silver_order_items
    description: Active (non-deleted) order line items, typed and conformed.
    columns:
      - name: order_item_key
        tests:
          - not_null
          - unique

  - name: silver_stocks
    description: Active (non-deleted) store/product stock levels, typed and conformed.
    columns:
      - name: store_product_key
        tests:
          - not_null
          - unique
