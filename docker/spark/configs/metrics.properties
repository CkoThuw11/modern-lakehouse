# Expose Spark metrics in Prometheus format on the driver UI at /metrics/prometheus/.
# Native to Spark 3.x — no JMX agent needed. Scraped by Prometheus at spark:4040.
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus/

# Also expose JVM and executor source metrics.
*.source.jvm.class=org.apache.spark.metrics.source.JvmSource
