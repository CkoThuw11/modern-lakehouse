# Rendered at container start: __MINIO_PORT__ is replaced from $MINIO_PORT (see the
# prometheus service command in docker-compose.yaml) so the port never drifts from .env.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Kafka broker — JMX exporter agent (broker throughput, replication, controller).
  - job_name: kafka
    static_configs:
      - targets: ["kafka:7071"]

  # Kafka Connect worker — JMX exporter agent (connector/task health, sink lag).
  - job_name: kafka-connect
    static_configs:
      - targets: ["kafka-connect:7072"]

  # Source Postgres — replication-slot lag (CDC health), connections, up.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Airflow — via StatsD → statsd_exporter (DAG/task success, durations, heartbeat).
  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]

  # Spark Thrift server — native PrometheusServlet on the driver UI.
  - job_name: spark
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets: ["spark:4040"]

  # MinIO — built-in cluster metrics (object-store / lakehouse storage growth).
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:__MINIO_PORT__"]

  # Grafana self-metrics.
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
