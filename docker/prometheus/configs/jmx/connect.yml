# JMX → Prometheus rules for the Kafka Connect worker (Debezium source + Iceberg sink).
# Focus: connector/task health and sink consumer lag — the pipeline signals that matter.
lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  # Per-connector task counts by state: running / paused / failed / total / unassigned /
  # destroyed. A drop in *_running_task_count (or a rise in *_failed_task_count) means a
  # connector is unhealthy.
  - pattern: 'kafka.connect<type=connect-worker-metrics, connector=(.+)><>connector-(running|paused|failed|total|unassigned|destroyed)-task-count'
    name: kafka_connect_connector_$2_task_count
    labels:
      connector: "$1"
    type: GAUGE

  # Worker-wide connector/task totals.
  - pattern: 'kafka.connect<type=connect-worker-metrics><>(connector-count|task-count)'
    name: kafka_connect_worker_$1
    type: GAUGE

  # Rebalance activity (churn = instability).
  - pattern: 'kafka.connect<type=connect-coordinator-metrics><>(rebalance-avg-time-ms|time-since-last-rebalance-ms)'
    name: kafka_connect_coordinator_$1
    type: GAUGE

  # Per-connector task throughput + commit health.
  - pattern: 'kafka.connect<type=(sink|source)-task-metrics, connector=(.+), task=(.+)><>(sink-record-read-rate|sink-record-send-rate|source-record-poll-rate|source-record-write-rate)'
    name: kafka_connect_$1_task_$4
    labels:
      connector: "$2"
      task: "$3"
    type: GAUGE
  - pattern: 'kafka.connect<type=connector-task-metrics, connector=(.+), task=(.+)><>(offset-commit-success-percentage|offset-commit-avg-time-ms)'
    name: kafka_connect_task_$3
    labels:
      connector: "$1"
      task: "$2"
    type: GAUGE

  # Sink consumer lag — climbs when the Iceberg sink falls behind or is paused.
  # (records-lag-max across the fetch manager; client-id identifies the sink consumer.)
  - pattern: 'kafka.consumer<type=consumer-fetch-manager-metrics, client-id=(.+)><>records-lag-max'
    name: kafka_consumer_records_lag_max
    labels:
      client_id: "$1"
    type: GAUGE
