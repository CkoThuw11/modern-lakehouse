connector.name=iceberg

# Talk to the same Iceberg REST Catalog Spark and Kafka Connect use — no Hive Metastore.
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://lakehouse/warehouse

# Native S3 filesystem against MinIO. Credentials come from the container
# environment (${ENV:...}) so no secret is committed and the settings stay identical
# to the REST Catalog / Spark / Kafka Connect wiring.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
